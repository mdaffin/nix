name: update-lock

# Updates flake.lock weekly and pushes it straight to main, but only if every
# check passes against the updated lock. If anything fails nothing is pushed
# and the run fails, so the hosts keep upgrading from the last good lock.

on:
  schedule:
    - cron: "0 3 * * 6"
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31.10.5
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            substituters = https://cache.nixos.org/
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
      - uses: nix-community/cache-nix-action@v7
        with:
          # restore and save a cache using this key
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          # if there's no cache hit, restore a cache by this prefix
          restore-prefixes-first-match: nix-${{ runner.os }}-
          # collect garbage until the Nix store size (in bytes) is at most this
          # number before trying to save a new cache; 1G = 1073741824
          gc-max-store-size-linux: 1G
          # purge caches created last accessed more than this duration ago
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-last-accessed: P1DT12H
          purge-primary-key: never
      - run: nix flake update
      - run: nix flake check
      - name: Evaluate hosts
        run: |
          for host in niver eulfe lucal; do
            nix build --dry-run ".#nixosConfigurations.$host.config.system.build.toplevel"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: flake-lock
          path: flake.lock

  push:
    needs: linux
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: flake-lock
      - name: Commit and push
        run: |
          if git diff --quiet flake.lock; then
            echo "flake.lock is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update flake.lock" flake.lock
          git push
